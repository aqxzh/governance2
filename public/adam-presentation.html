let selectedFinish = 0;
const pen = document.getElementById('penImage');
const label = document.getElementById('finishLabel');
const swatches = [...document.querySelectorAll('[data-finish]')];
function changeFinish(index){
 if(!Number.isInteger(index) || !FINISHES[index]) return;
 selectedFinish=index;
 const finish=FINISHES[index];
 pen.setAttribute('aria-label',`Адам: ${finish.name}`);
 document.getElementById('penFinishOverlay').setAttribute('opacity',index===0?'0':'1');
 document.querySelectorAll('#penBodyTone stop').forEach((el,i)=>el.setAttribute('stop-color',finish.gradient[i]));
 const face=document.getElementById('penFace');
 face.setAttribute('fill',finish.face);
 face.querySelector('path').setAttribute('stroke',finish.face);
 document.getElementById('penGlints').setAttribute('fill',finish.glint);
 label.textContent=finish.name+' · новая отделка';
 document.querySelectorAll('[data-accent-fill]').forEach(el=>el.setAttribute('fill',finish.accent));
 document.documentElement.style.setProperty('--accent',finish.accent);
 swatches.forEach((el,i)=>el.setAttribute('aria-pressed',String(i===index)));
}
function activate(el, fn){el.addEventListener('click',fn);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn();}});}
swatches.forEach((el,i)=>{
 activate(el,()=>changeFinish(i));
 el.addEventListener('keydown',e=>{let next;if(e.key==='ArrowRight') next=(i+1)%FINISHES.length;if(e.key==='ArrowLeft') next=(i+FINISHES.length-1)%FINISHES.length;if(e.key==='Home') next=0;if(e.key==='End') next=FINISHES.length-1;if(next!==undefined){e.preventDefault();changeFinish(next);swatches[next].focus();}});
});
const dialog=document.getElementById('detailsDialog');
function openDetails(data,number){
 document.getElementById('dialogIndex').textContent=number ? `ВОЗМОЖНОСТИ / ${String(number).padStart(2,'0')}` : 'АДАМ / 2.3';
 document.getElementById('dialogTitle').textContent=data.title;
 document.getElementById('dialogIntro').textContent=data.intro;
 const list=document.getElementById('dialogList');list.replaceChildren();
 data.details.forEach(text=>{const li=document.createElement('li');li.textContent=text;list.appendChild(li);});
 document.getElementById('dialogTip').textContent=data.tip;
 dialog.showModal();
}
document.querySelectorAll('[data-feature]').forEach(el=>activate(el,()=>{const i=Number(el.dataset.feature);openDetails(FEATURES[i],i+1);}));
document.querySelectorAll('[data-info]').forEach(el=>activate(el,()=>openDetails(EXTRA[el.dataset.info])));
document.getElementById('closeDialog').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',e=>{const b=dialog.getBoundingClientRect();if(e.target===dialog&&(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)) dialog.close();});
